<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>außer Betrieb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #0a0a08;
    --yellow: #f5c200;
    --red: #cc2200;
    --gray: #2a2a26;
    --light: #b0ad9e;
    --stripe-size: 48px;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--light);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 10;
  }

  /* Hazard tape top and bottom */
  .tape {
    position: fixed;
    left: 0; right: 0;
    height: 36px;
    background: repeating-linear-gradient(
      -45deg,
      var(--yellow) 0,
      var(--yellow) calc(var(--stripe-size) / 2),
      var(--black) calc(var(--stripe-size) / 2),
      var(--black) var(--stripe-size)
    );
    z-index: 20;
  }
  .tape-top { top: 0; }
  .tape-bottom { bottom: 0; }

  /* Scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 5;
  }

  .center {
    text-align: center;
    position: relative;
    z-index: 30;
    padding: 0 2rem;
  }

  /* Warning icon */
  .icon-wrap {
    margin-bottom: 2rem;
    display: flex;
    justify-content: center;
    animation: pulse 2.4s ease-in-out infinite;
  }

  .icon-wrap svg {
    width: 72px;
    height: 72px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Main heading */
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 16vw, 200px);
    line-height: 0.9;
    letter-spacing: 0.04em;
    color: var(--yellow);
    position: relative;
    display: inline-block;
    text-transform: uppercase;
    animation: glitch 5s infinite;
  }

  h1::before,
  h1::after {
    content: 'außer Betrieb';
    position: absolute;
    top: 0; left: 0; right: 0;
    overflow: hidden;
  }

  h1::before {
    color: var(--red);
    clip-path: polygon(0 25%, 100% 25%, 100% 40%, 0 40%);
    animation: glitch-r 5s infinite;
    opacity: 0;
  }

  h1::after {
    color: #00e5ff;
    clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
    animation: glitch-b 5s infinite;
    opacity: 0;
  }

  @keyframes glitch {
    0%, 92%, 100% { transform: none; }
    93% { transform: skewX(-2deg); }
    94% { transform: skewX(2deg) scaleX(1.01); }
    95% { transform: none; }
    97% { transform: skewX(-1deg); }
    98% { transform: none; }
  }

  @keyframes glitch-r {
    0%, 91%, 96%, 100% { opacity: 0; transform: none; }
    92% { opacity: 1; transform: translate(-4px, 0); }
    93% { opacity: 1; transform: translate(4px, 0); }
    94% { opacity: 0; }
    97% { opacity: 1; transform: translate(-2px, 0); }
    98% { opacity: 0; }
  }

  @keyframes glitch-b {
    0%, 91%, 96%, 100% { opacity: 0; transform: none; }
    92% { opacity: 1; transform: translate(4px, 0); }
    93% { opacity: 1; transform: translate(-4px, 0); }
    94% { opacity: 0; }
    97% { opacity: 1; transform: translate(3px, 0); }
    98% { opacity: 0; }
  }

  /* Sub line */
  .sub {
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--light);
    margin-top: 1.5rem;
    opacity: 0.6;
    animation: blink-fade 3.5s infinite;
  }

  @keyframes blink-fade {
    0%, 100% { opacity: 0.6; }
    48% { opacity: 0.6; }
    50% { opacity: 0.1; }
    52% { opacity: 0.6; }
    80% { opacity: 0.6; }
    82% { opacity: 0.1; }
    84% { opacity: 0.6; }
  }

  /* Status bar */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 2.5rem;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--red);
    text-transform: uppercase;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    animation: blink-dot 1.1s steps(1) infinite;
  }

  @keyframes blink-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Error code */
  .error-code {
    position: fixed;
    bottom: 52px;
    right: 1.5rem;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--gray);
    z-index: 25;
  }
</style>
</head>
<body>

<div class="tape tape-top"></div>
<div class="tape tape-bottom"></div>
<div class="scanlines"></div>

<div class="center">
  <div class="icon-wrap">
    <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="36,6 68,62 4,62" fill="none" stroke="#f5c200" stroke-width="4" stroke-linejoin="round"/>
      <line x1="36" y1="28" x2="36" y2="44" stroke="#f5c200" stroke-width="5" stroke-linecap="round"/>
      <circle cx="36" cy="53" r="3" fill="#f5c200"/>
    </svg>
  </div>

  <h1>außer<br>Betrieb</h1>

  <p class="sub">system offline &nbsp;·&nbsp; keine verbindung</p>

  <div class="status">
    <span class="dot"></span>
    Fehler erkannt — bitte später erneut versuchen
  </div>
</div>

<div class="error-code">ERR::SYS_HALT // 0x00FF</div>

</body>
</html>
